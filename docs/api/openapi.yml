components:
  schemas:
    AssistantProposal:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        business:
          type: string
          format: uuid
          readOnly: true
        location:
          type: string
          format: uuid
          readOnly: true
        input_type:
          allOf:
          - $ref: '#/components/schemas/InputTypeEnum'
          readOnly: true
        locale:
          type: string
          readOnly: true
        content:
          type: string
          readOnly: true
        attachments:
          readOnly: true
        command_type:
          type: string
          readOnly: true
        payload:
          readOnly: true
        preview:
          type: string
          readOnly: true
        preview_data:
          readOnly: true
        warnings:
          readOnly: true
        blocking_questions:
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/AssistantProposalStatusEnum'
          readOnly: true
        version:
          type: integer
          readOnly: true
        expires_at:
          type: string
          format: date-time
          readOnly: true
        confirmed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        confirmed_result_type:
          type: string
          readOnly: true
        confirmed_result_id:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - attachments
      - blocking_questions
      - business
      - command_type
      - confirmed_at
      - confirmed_result_id
      - confirmed_result_type
      - content
      - created_at
      - expires_at
      - id
      - input_type
      - locale
      - location
      - payload
      - preview
      - preview_data
      - status
      - version
      - warnings
    AssistantProposalStatusEnum:
      enum:
      - DRAFT
      - READY
      - PROCESSING
      - CONFIRMED
      - CANCELLED
      - EXPIRED
      type: string
      description: |-
        * `DRAFT` - Needs clarification
        * `READY` - Ready to confirm
        * `PROCESSING` - Reading attachment
        * `CONFIRMED` - Confirmed
        * `CANCELLED` - Cancelled
        * `EXPIRED` - Expired
    Attachment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        business:
          type: string
          format: uuid
          readOnly: true
        kind:
          type: string
          readOnly: true
          default: sale-invoice
        sale:
          type: string

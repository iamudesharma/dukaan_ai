# Render Blueprint for the DukaanAI production API plane.
# Durable business data lives in Supabase Postgres/Storage, never in Render disks
# or the queue. See docs/runbooks/deploy-render.md before the first deployment.

envVarGroups:
  # Render ignores `sync: false` inside environment groups. This group therefore
  # contains only generated/non-secret constants. Environment-specific secrets
  # are declared on each service below and entered during initial Blueprint setup.
  - name: dukaan-runtime
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: UV_VERSION
        value: 0.9.17
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECURE_SSL_REDIRECT
        value: "true"
      - key: DJANGO_SECURE_HSTS_SECONDS
        value: "3600"
      - key: DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS
        value: "false"
      - key: DJANGO_SECURE_HSTS_PRELOAD
        value: "false"
      - key: DJANGO_USE_X_FORWARDED_HOST
        value: "true"
      - key: DEV_AUTH_ENABLED
        value: "false"
      - key: SUPABASE_JWT_AUDIENCE
        value: authenticated
      - key: SUPABASE_STORAGE_BUCKET
        value: receipts
      - key: SENTRY_ENVIRONMENT
        value: production

services:
  - type: web
    name: dukaan-web
    runtime: static
    buildCommand: npm ci && npm run build:web
    staticPublishPath: apps/web/dist
    autoDeployTrigger: checksPass
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_DEMO_MODE
        value: "false"
      - key: VITE_SENTRY_DSN
        sync: false
      - key: VITE_SENTRY_ENVIRONMENT
        value: production

  - type: keyvalue
    name: dukaan-redis
    region: singapore
    plan: 256mb
    ipAllowList: []
    maxmemoryPolicy: noeviction
    persistenceMode: journal-snapshot

  - type: web
    name: dukaan-api
    runtime: python
    region: singapore
    plan: 0.5c-512mb
    rootDir: services/api
    buildCommand: uv sync --locked --no-dev && uv run --locked --no-dev python manage.py collectstatic --noinput
    preDeployCommand: uv run --locked --no-dev python manage.py migrate --noinput
    startCommand: uv run --locked --no-dev gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 60 --access-logfile - --error-logfile -
    healthCheckPath: /readyz/
    autoDeployTrigger: checksPass
    numInstances: 1
    envVars:
      - fromGroup: dukaan-runtime
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_JWKS_URL
        sync: false
      - key: SUPABASE_JWT_ISSUER
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: DUKAAN_APP_DB_ROLE
        value: dukaan_app
      - key: DUKAAN_APP_DB_PASSWORD
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.4-mini
      - key: FCM_SERVICE_ACCOUNT_JSON
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: dukaan-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: dukaan-redis
          property: connectionString

  - type: worker
    name: dukaan-worker
    runtime: python
    region: singapore
    plan: 0.5c-512mb
    rootDir: services/api
    buildCommand: uv sync --locked --no-dev
    startCommand: uv run --locked --no-dev celery -A config worker --loglevel=INFO --concurrency=2 --max-tasks-per-child=200
    autoDeployTrigger: checksPass
    numInstances: 1
    envVars:
      - fromGroup: dukaan-runtime
      - key: DATABASE_URL
        sync: false
      - key: DUKAAN_APP_DB_ROLE
        value: dukaan_app
      - key: DUKAAN_APP_DB_PASSWORD
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.4-mini
      - key: FCM_SERVICE_ACCOUNT_JSON
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: dukaan-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: dukaan-redis
          property: connectionString

  - type: cron
    name: dukaan-scheduler
    runtime: python
    region: singapore
    plan: 0.5c-512mb
    rootDir: services/api
    schedule: "* * * * *"
    buildCommand: uv sync --locked --no-dev
    startCommand: uv run --locked --no-dev python manage.py dispatch_scheduled
    autoDeployTrigger: checksPass
    envVars:
      - fromGroup: dukaan-runtime
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: dukaan-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: dukaan-redis
          property: connectionString

# Render Blueprint for the DukaanAI production API plane.
# Durable business data lives in hosted Postgres/private Storage, never in Render disks
# or the queue. See docs/runbooks/deploy-render.md before the first deployment.

envVarGroups:
  # Render ignores `sync: false` inside environment groups. This group therefore
  # contains only generated/non-secret constants. Environment-specific secrets
  # are declared on each service below and entered during initial Blueprint setup.
  - name: dukaan-runtime
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: UV_VERSION
        value: 0.9.17
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECURE_SSL_REDIRECT
        value: "true"
      - key: DJANGO_SECURE_HSTS_SECONDS
        value: "3600"
      - key: DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS
        value: "false"
      - key: DJANGO_SECURE_HSTS_PRELOAD
        value: "false"
      - key: DJANGO_USE_X_FORWARDED_HOST
        value: "true"
      - key: DEV_AUTH_ENABLED
        value: "false"
      - key: SMS_ENABLED
        value: "false"
      - key: OTP_EXPOSE_DEV_CODE
        value: "false"
      - key: DUKAAN_USE_APP_DB_ROLE
        value: "true"
      - key: FCM_ENABLED
        value: "false"
      - key: ATTACHMENT_QUARANTINE_REQUIRED
        value: "true"
      - key: ATTACHMENT_QUARANTINE_RETENTION_DAYS
        value: "7"
      - key: ATTACHMENT_RETENTION_DAYS
        value: "30"
      - key: SENTRY_ENVIRONMENT
        value: production

services:
  - type: web
    name: dukaan-web
    runtime: static
    buildCommand: npm ci && npm run build:web
    staticPublishPath: apps/web/dist
    autoDeployTrigger: checksPass
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_SENTRY_DSN
        sync: false
      - key: VITE_SENTRY_ENVIRONMENT
        value: production

  - type: keyvalue
    name: dukaan-redis
    region: singapore
    plan: 256mb
    ipAllowList: []
    maxmemoryPolicy: noeviction
    persistenceMode: journal-snapshot

  - type: web
    name: dukaan-api
    runtime: docker
    region: singapore
    plan: 0.5c-512mb
    rootDir: services/api
    dockerfilePath: ./Dockerfile
    dockerCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 60 --access-logfile - --error-logfile -
    preDeployCommand: DUKAAN_USE_APP_DB_ROLE=false uv run --locked --no-dev python manage.py migrate --noinput
    healthCheckPath: /readyz/
    autoDeployTrigger: checksPass
    numInstances: 1
    envVars:
      - fromGroup: dukaan-runtime
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DUKAAN_APP_DATABASE_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: DUKAAN_APP_DB_ROLE
        value: dukaan_app
      - key: AI_API_KEY
        sync: false
      - key: USE_AI_INTERPRETER
        sync: false
      - key: AI_PROVIDER
        value: openai_compatible
      - key: AI_API_BASE
        sync: false
      - key: SMS_ENABLED
        sync: false
      - key: SMS_PROVIDER
        value: msg91
      - key: MSG91_AUTH_KEY
        sync: false
      - key: MSG91_OTP_TEMPLATE_ID
        sync: false
      - key: MSG91_OTP_VARIABLE
        value: OTP
      - key: MSG91_API_BASE
        value: https://control.msg91.com/api/v5
      - key: SMS_TIMEOUT_SECONDS
        value: "15"
      - key: STORAGE_BACKEND
        value: supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: business-documents
      - key: GMAIL_ENABLED
        sync: false
      - key: GMAIL_AI_EXTRACTION
        sync: false
      - key: GMAIL_CLIENT_ID
        sync: false
      - key: GMAIL_CLIENT_SECRET
        sync: false
      - key: GMAIL_REDIRECT_URI
        sync: false
      - key: GMAIL_WEB_REDIRECT_URL
        sync: false
      - key: GMAIL_TOKEN_ENCRYPTION_KEY
        sync: false
      - key: ATTACHMENT_SCANNER
        sync: false
      - key: AI_MODEL
        value: gpt-5.4-mini
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: dukaan-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: dukaan-redis
          property: connectionString

  - type: worker
    name: dukaan-worker
    runtime: docker
    region: singapore
    plan: 0.5c-512mb
    rootDir: services/api
    dockerfilePath: ./Dockerfile
    dockerCommand: celery -A config worker --loglevel=INFO --concurrency=2 --max-tasks-per-child=200
    autoDeployTrigger: checksPass
    numInstances: 1
    envVars:
      - fromGroup: dukaan-runtime
      - key: DATABASE_URL
        sync: false
      - key: DUKAAN_APP_DATABASE_URL
        sync: false
      - key: DUKAAN_APP_DB_ROLE
        value: dukaan_app
      - key: AI_API_KEY
        sync: false
      - key: USE_AI_INTERPRETER
        sync: false
      - key: AI_PROVIDER
        value: openai_compatible
      - key: AI_API_BASE
        sync: false
      - key: AI_MODEL
        value: gpt-5.4-mini
      - key: STORAGE_BACKEND
        value: supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: business-documents
      - key: ATTACHMENT_SCANNER
        sync: false
      - key: STT_PROVIDER
        value: whisper
      - key: STT_MODEL
        value: whisper-1
      - key: STT_API_BASE
        sync: false
      - key: STT_API_KEY
        sync: false
      - key: STT_TIMEOUT_SECONDS
        value: "60"
      - key: OCR_ENABLED
        value: "true"
      - key: OCR_API_URL
        sync: false
      - key: OCR_API_TOKEN
        sync: false
      - key: OCR_PROVIDER
        value: ocria
      - key: OCR_LANGUAGES
        value: eng+hin
      - key: OCR_REQUEST_TIMEOUT_SECONDS
        value: "120"
      - key: OCR_POLL_TIMEOUT_SECONDS
        value: "300"
      - key: OCR_POLL_INTERVAL_SECONDS
        value: "1"
      - key: OCR_MAX_RESULT_BYTES
        value: "2097152"
      - key: FCM_PROJECT_ID
        sync: false
      - key: FCM_SERVICE_ACCOUNT_JSON
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: dukaan-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: dukaan-redis
          property: connectionString

  - type: cron
    name: dukaan-scheduler
    runtime: docker
    region: singapore
    plan: 0.5c-512mb
    rootDir: services/api
    dockerfilePath: ./Dockerfile
    dockerCommand: python manage.py run_scheduled --purge-limit 100
    schedule: "* * * * *"
    autoDeployTrigger: checksPass
    envVars:
      - fromGroup: dukaan-runtime
      - key: DATABASE_URL
        sync: false
      - key: DUKAAN_APP_DATABASE_URL
        sync: false
      - key: STORAGE_BACKEND
        value: supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: business-documents
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: dukaan-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: dukaan-redis
          property: connectionString

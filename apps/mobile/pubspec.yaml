name: dukaan_ai_mobile
description: Mobile-first AI business assistant for Indian shops.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  connectivity_plus: ^6.1.5
  decimal: ^3.2.4
  dio: ^5.9.0
  drift: ^2.34.4
  file_picker: ^10.3.10
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^9.2.4
  go_router: ^14.8.1
  image_picker: ^1.2.1
  intl: ^0.20.3
  path_provider: ^2.1.5
  share_plus: ^11.0.0
  speech_to_text: ^7.4.0
  sqlite3_flutter_libs: ^0.5.39
  uuid: ^4.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true


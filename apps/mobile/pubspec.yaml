name: dukaan_ai_mobile
description: Mobile-first AI business assistant for Indian shops.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  connectivity_plus: ^6.1.5
  decimal: ^3.2.4
  dio: ^5.9.0
  drift: ^2.28.1
  file_picker: ^10.3.10
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^9.2.4
  go_router: ^14.8.1
  image_picker: ^1.2.1
  intl: ^0.20.3
  path_provider: ^2.1.5
  record: ^7.2.0
  share_plus: ^11.0.0
  speech_to_text: ^7.4.0
  sqlite3_flutter_libs: ^0.5.39
  uuid: ^4.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  fonts:
    # Weights are static instances cut from the variable sources, so Flutter
    # matches on OS/2 usWeightClass instead of guessing. See
    # packages/design-tokens/scripts/fetch-fonts.mjs. Licences live in
    # packages/design-tokens/font-licenses.
    - family: Manrope
      fonts:
        - asset: assets/fonts/manrope-400.ttf
          weight: 400
        - asset: assets/fonts/manrope-500.ttf
          weight: 500
        - asset: assets/fonts/manrope-600.ttf
          weight: 600
        - asset: assets/fonts/manrope-700.ttf
          weight: 700
        - asset: assets/fonts/manrope-800.ttf
          weight: 800
    - family: NotoSansDevanagari
      fonts:
        - asset: assets/fonts/noto-devanagari-400.ttf
          weight: 400
        - asset: assets/fonts/noto-devanagari-500.ttf
          weight: 500
        - asset: assets/fonts/noto-devanagari-600.ttf
          weight: 600
        - asset: assets/fonts/noto-devanagari-700.ttf
          weight: 700
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/plex-mono-400.ttf
          weight: 400
        - asset: assets/fonts/plex-mono-500.ttf
          weight: 500


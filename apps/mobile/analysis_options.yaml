analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
    # Generated OpenAPI client: owned by `make mobile-gen`, not hand-edited.
    - packages/dukaan_api_client/**
include: package:flutter_lints/flutter.yaml

linter:
  rules:
    always_use_package_imports: true
    avoid_print: true
    prefer_final_locals: true
    use_super_parameters: true

